<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLE Hunter V4</title>
    <style>
        :root { --bg: #000; --surf: #111; --prim: #0f0; --sec: #00f; --hl: #ff0055; --txt: #eee; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--txt); margin: 0; padding-bottom: 300px; font-size: 13px; }
        
        /* UI Framework */
        button { background: #222; color: var(--prim); border: 1px solid #444; padding: 8px; font-family: inherit; font-weight: bold; width: 100%; margin-bottom: 5px; }
        button:active { background: var(--prim); color: #000; }
        button.danger { color: var(--hl); border-color: var(--hl); }
        input, textarea { background: #080808; color: #fff; border: 1px solid #333; width: 100%; padding: 5px; font-family: monospace; margin-bottom: 5px; }
        
        .panel { border: 1px solid #333; background: var(--surf); margin: 10px; padding: 10px; }
        .head { color: var(--prim); border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; text-transform: uppercase; }
        
        /* Dynamic UUID List */
        .uuid-item { display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; padding: 5px; margin-bottom: 5px; background: #000; }
        .uuid-txt { font-size: 0.7rem; word-break: break-all; color: #aaa; }
        .btn-use { width: auto; padding: 4px 10px; font-size: 0.7rem; margin: 0; }

        /* Terminal & Graph */
        #term { position: fixed; bottom: 0; left: 0; right: 0; height: 25vh; background: rgba(0,0,0,0.95); border-top: 1px solid var(--prim); overflow-y: auto; padding: 5px; font-size: 0.7rem; z-index: 99; }
        .log-line { border-bottom: 1px solid #222; display: flex; }
        .ts { min-width: 60px; color: #555; }
        .l-sys { color: #888; } .l-rx { color: var(--prim); } .l-tx { color: var(--sec); } .l-err { color: var(--hl); }
        
        /* Tab System */
        .tabs { display: flex; border-bottom: 1px solid #333; margin: 10px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; background: #111; opacity: 0.5; }
        .tab.active { opacity: 1; border-bottom: 2px solid var(--prim); color: var(--prim); }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

<div style="padding:10px; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center;">
    <span>BLE HUNTER V4</span>
    <div id="status" style="font-size:0.7rem; color:#666;">IDLE</div>
</div>

<div class="tabs">
    <div class="tab active" onclick="sw('scan')">1. HUNT</div>
    <div class="tab" onclick="sw('interact')">2. HACK</div>
</div>

<div id="scan" class="view active">
    <div class="panel">
        <div class="head">Step 1: Sniff UUIDs</div>
        <div style="font-size:0.8rem; color:#888; margin-bottom:10px;">
            Scannt Advertisements OHNE Verbindung, um versteckte Services zu finden.
        </div>
        <button onclick="startSniff()">START SNIFFER</button>
        <div id="uuidList" style="margin-top:10px;"></div>
    </div>
    
    <div class="panel">
        <div class="head">Manual Target</div>
        <input type="text" id="manualUuid" placeholder="Gefundene UUID hier..." />
        <button class="danger" onclick="connectTarget()">CONNECT TO TARGET</button>
    </div>
</div>

<div id="interact" class="view">
    <div class="panel">
        <div class="head">Target Control</div>
        <div id="charList">Not connected.</div>
    </div>

    <div class="panel">
        <div class="head">Payload Injector</div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px; margin-bottom:5px;">
            <button onclick="inject([0xFC, 0x05, 0xFF, 0x00, 0x00])">Dreamscreen Red?</button>
            <button onclick="inject([0x00])">KeepAlive 0x00</button>
            <button onclick="inject([0xCC, 0x23, 0x33])">LED Magic 1</button>
            <button onclick="inject([0x7E, 0x00, 0x05])">Start Flag 0x7E</button>
        </div>
        <textarea id="customHex" placeholder="Custom Hex: 01 A2 FF..."></textarea>
        <button onclick="sendCustom()">SEND CUSTOM HEX</button>
    </div>
</div>

<div id="term"></div>

<script>
    // --- GLOBALS ---
    let sniffDevice = null;
    let targetDevice = null;
    let targetServer = null;
    let writeChar = null; // Die primäre Write-Char
    let foundUUIDs = new Set();
    const ui = {
        list: document.getElementById('uuidList'),
        status: document.getElementById('status'),
        manual: document.getElementById('manualUuid'),
        chars: document.getElementById('charList'),
        term: document.getElementById('term')
    };

    // --- LOGGING ---
    function log(msg, type='sys') {
        const ts = new Date().toISOString().substr(11,8);
        ui.term.innerHTML += `<div class="log-line"><span class="ts">${ts}</span><span class="l-${type}">${msg}</span></div>`;
        ui.term.scrollTop = ui.term.scrollHeight;
    }

    // --- STEP 1: SNIFFER ---
    async function startSniff() {
        try {
            foundUUIDs.clear();
            ui.list.innerHTML = '';
            log("Requesting Device for Sniffing...", 'sys');
            
            // Wir verbinden NICHT. Wir holen nur das Device Handle.
            sniffDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [] // Leer lassen, wir wollen nur Advertisements
            });

            ui.status.innerText = "SNIFFING: " + sniffDevice.name;
            log(`Watching Advertisements from ${sniffDevice.name}...`, 'sys');

            const abortController = new AbortController();
            
            sniffDevice.addEventListener('advertisementreceived', (event) => {
                if(event.uuids) {
                    event.uuids.forEach(u => {
                        if(!foundUUIDs.has(u)) {
                            foundUUIDs.add(u);
                            addUuidToUi(u);
                            log(`FOUND UUID: ${u}`, 'l-rx');
                        }
                    });
                }
            });

            await sniffDevice.watchAdvertisements({ signal: abortController.signal });
            
        } catch(e) { log(e, 'err'); }
    }

    function addUuidToUi(uuid) {
        const div = document.createElement('div');
        div.className = 'uuid-item';
        div.innerHTML = `
            <span class="uuid-txt">${uuid}</span>
            <button class="btn-use" onclick="selectUuid('${uuid}')">USE</button>
        `;
        ui.list.appendChild(div);
    }

    function selectUuid(uuid) {
        ui.manual.value = uuid;
        log(`Target UUID set to ${uuid}`, 'sys');
        // Visueller Hinweis
        document.querySelectorAll('.btn-use').forEach(b => b.style.background = '#222');
        event.target.style.background = 'var(--prim)';
    }

    // --- STEP 2: CONNECT & HACK ---
    async function connectTarget() {
        const targetUUID = ui.manual.value.trim();
        if(!targetUUID) return alert("Keine UUID gewählt/eingegeben!");

        try {
            log("Starting Connection Phase...", 'sys');
            log(`Requesting access to: ${targetUUID}`, 'l-tx');
            
            // HIER PASSIERT DIE MAGIE: Wir requesten neu MIT der UUID
            targetDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true, 
                optionalServices: [targetUUID, "battery_service", "device_information"]
            });

            targetDevice.addEventListener('gattserverdisconnected', () => {
                ui.status.innerText = "DISCONNECTED";
                log("Connection lost", 'err');
            });

            ui.status.innerText = "CONNECTING...";
            targetServer = await targetDevice.gatt.connect();
            ui.status.innerText = "CONNECTED (HACK MODE)";
            log("Connected! Enumerating Services...", 'sys');
            
            sw('interact'); // UI Wechsel
            await exploreServices();

        } catch(e) { log(e, 'err'); }
    }

    async function exploreServices() {
        ui.chars.innerHTML = '';
        const services = await targetServer.getPrimaryServices();
        
        for(const s of services) {
            try {
                const chars = await s.getCharacteristics();
                for(const c of chars) {
                    const div = document.createElement('div');
                    div.style.borderLeft = "2px solid #333";
                    div.style.marginLeft = "5px";
                    div.style.padding = "5px";
                    div.style.marginBottom = "5px";
                    
                    let info = `<div style="color:#aaa; font-size:0.7rem;">${c.uuid}</div>`;
                    let actions = '';

                    // Schreibrechte prüfen
                    if(c.properties.write || c.properties.writeWithoutResponse) {
                        info += `<div style="color:var(--prim); font-weight:bold;">[WRITABLE]</div>`;
                        actions += `<button onclick="setWriteChar('${c.uuid}')">SET AS TARGET</button>`;
                        
                        // Automatisch die erste Writable auswählen
                        if(!writeChar) {
                            writeChar = c;
                            log(`Auto-Selected Write Char: ${c.uuid}`, 'sys');
                            div.style.borderLeft = "2px solid var(--prim)";
                        }
                    }
                    
                    if(c.properties.read) info += ` [READ]`;
                    if(c.properties.notify) info += ` [NOTIFY]`;

                    div.innerHTML = info + actions;
                    ui.chars.appendChild(div);
                    
                    // Store reference
                    c._ref = c;
                }
            } catch(e) { log(`Access denied to service ${s.uuid}`, 'l-err'); }
        }
    }

    async function setWriteChar(uuid) {
        // Suchen wir die Char im Speicher wieder (quick & dirty)
        const services = await targetServer.getPrimaryServices();
        for(const s of services) {
            const chars = await s.getCharacteristics();
            const match = chars.find(c => c.uuid === uuid);
            if(match) {
                writeChar = match;
                log(`Target Char updated: ${uuid}`, 'sys');
                alert("Target Set!");
                return;
            }
        }
    }

    // --- INJECTOR LOGIC ---
    async function inject(byteArray) {
        if(!writeChar) return alert("No Writable Characteristic found/selected!");
        try {
            const data = new Uint8Array(byteArray);
            await writeChar.writeValue(data);
            const hex = [...data].map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
            log(`TX: ${hex}`, 'l-tx');
        } catch(e) { log(e, 'err'); }
    }

    async function sendCustom() {
        const str = document.getElementById('customHex').value;
        // Parse Hex String (z.B. "FF 0A 00")
        const bytes = str.match(/[0-9A-Fa-f]{2}/g);
        if(bytes) {
            await inject(bytes.map(b => parseInt(b, 16)));
        } else {
            log("Invalid Hex format", 'err');
        }
    }

    // --- UTILS ---
    window.sw = (id) => {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    };
</script>
</body>
</html>
