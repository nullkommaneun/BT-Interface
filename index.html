<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardcore BLE Scanner</title>
    <style>
        :root { --bg: #121212; --surface: #1e1e1e; --primary: #bb86fc; --text: #e0e0e0; --success: #03dac6; --error: #cf6679; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); margin: 0; padding: 0; padding-bottom: 200px; }
        header { background: var(--surface); padding: 15px; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        h1 { font-size: 1.2rem; margin: 0; }
        button { background: var(--primary); color: #000; border: none; padding: 10px 15px; font-weight: bold; cursor: pointer; margin-right: 5px; }
        button:disabled { opacity: 0.5; }
        
        .device-info { padding: 15px; border-bottom: 1px solid #333; }
        .service-block { margin: 10px; padding: 10px; background: var(--surface); border: 1px solid #333; }
        .service-uuid { color: var(--success); font-weight: bold; font-size: 0.9rem; }
        
        .char-block { margin-top: 10px; padding-left: 10px; border-left: 2px solid var(--primary); }
        .char-uuid { font-size: 0.8rem; color: #aaa; margin-bottom: 5px; display: block; }
        .char-props { font-size: 0.7rem; color: #666; margin-bottom: 5px; }
        
        .actions { display: flex; gap: 5px; margin-bottom: 5px; }
        .actions button { font-size: 0.7rem; padding: 5px 10px; background: #333; color: #fff; border: 1px solid #555; }
        
        .value-display { font-size: 0.8rem; color: var(--success); word-break: break-all; background: #000; padding: 5px; margin-top: 5px; display: none; }

        /* Der On-Screen Debugger */
        #debugger {
            position: fixed; bottom: 0; left: 0; right: 0; height: 30vh;
            background: rgba(0,0,0,0.95); border-top: 2px solid var(--primary);
            overflow-y: auto; padding: 10px; font-size: 0.75rem;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        .log-entry { margin-bottom: 4px; border-bottom: 1px solid #222; }
        .log-time { color: #666; margin-right: 5px; }
        .log-info { color: var(--text); }
        .log-warn { color: var(--primary); }
        .log-error { color: var(--error); }
        .log-data { color: var(--success); }
    </style>
</head>
<body>

<header>
    <button id="btnScan">SCAN & CONNECT</button>
    <button id="btnDisconnect" disabled>DISCONNECT</button>
</header>

<div id="app-content">
    <div class="device-info" id="deviceInfo">Kein Gerät verbunden.</div>
    <div id="servicesContainer"></div>
</div>

<div id="debugger">
    <div class="log-entry"><span class="log-time">--:--:--</span> <span class="log-info">System bereit. Warte auf Input...</span></div>
</div>

<script>
    // --- Konfiguration & Globals ---
    let currentDevice = null;
    let currentServer = null;
    
    const ui = {
        btnScan: document.getElementById('btnScan'),
        btnDisconnect: document.getElementById('btnDisconnect'),
        deviceInfo: document.getElementById('deviceInfo'),
        servicesContainer: document.getElementById('servicesContainer'),
        debugger: document.getElementById('debugger')
    };

    // --- Logger System (Ersetzt console.log für Mobile) ---
    function log(msg, type = 'info') {
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}.${now.getMilliseconds().toString().padStart(3,'0')}`;
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `<span class="log-time">${timeStr}</span> <span class="log-${type}">${msg}</span>`;
        
        ui.debugger.appendChild(entry);
        ui.debugger.scrollTop = ui.debugger.scrollHeight; // Auto-Scroll
        console.log(`[${type.toUpperCase()}]`, msg);
    }

    // --- Helper: DataView zu Hex String ---
    function dataToHex(dataView) {
        let hex = [];
        for (let i = 0; i < dataView.byteLength; i++) {
            hex.push('0x' + dataView.getUint8(i).toString(16).padStart(2, '0').toUpperCase());
        }
        return hex.join(' ');
    }

    // --- Core Bluetooth Logic ---

    async function startScan() {
        try {
            log("Starte Scan...", "info");
            // ACHTUNG: acceptAllDevices: true erlaubt Verbindung, aber Zugriff auf Services ist eingeschränkt 
            // ohne 'optionalServices'. Da wir "Universal" sind, fügen wir hier gängige Services hinzu.
            // Für proprietäre Geräte musst du hier ggf. die UUID manuell ergänzen!
            const options = {
                acceptAllDevices: true,
                optionalServices: [
                    "battery_service", "device_information", "health_thermometer", "heart_rate",
                    // Füge hier bekannte proprietäre UUIDs hinzu, falls nötig
                ]
            };

            currentDevice = await navigator.bluetooth.requestDevice(options);
            
            ui.deviceInfo.innerText = `Verbunden mit: ${currentDevice.name || 'Unnamed Device'} (${currentDevice.id})`;
            log(`Gerät gewählt: ${currentDevice.name}`, "success");

            currentDevice.addEventListener('gattserverdisconnected', onDisconnected);

            log("Verbinde mit GATT Server...", "info");
            currentServer = await currentDevice.gatt.connect();
            log("GATT verbunden!", "success");
            
            ui.btnScan.disabled = true;
            ui.btnDisconnect.disabled = false;

            discoverServices();

        } catch (error) {
            log(`Scan Fehler: ${error}`, "error");
        }
    }

    async function discoverServices() {
        ui.servicesContainer.innerHTML = '';
        log("Suche Services...", "info");

        try {
            const services = await currentServer.getPrimaryServices();
            log(`${services.length} Services gefunden.`, "info");

            for (const service of services) {
                const serviceDiv = document.createElement('div');
                serviceDiv.className = 'service-block';
                serviceDiv.innerHTML = `<div class="service-uuid">Service: ${getServiceName(service.uuid)}</div>`;
                
                ui.servicesContainer.appendChild(serviceDiv);

                // Characteristics laden
                try {
                    const characteristics = await service.getCharacteristics();
                    for (const char of characteristics) {
                        renderCharacteristic(serviceDiv, char);
                    }
                } catch (err) {
                    log(`Konnte Chars für ${service.uuid} nicht laden: ${err}`, "warn");
                }
            }
        } catch (error) {
            log(`Service Discovery Fehler: ${error}`, "error");
        }
    }

    function renderCharacteristic(container, char) {
        const props = [];
        if (char.properties.read) props.push("READ");
        if (char.properties.write) props.push("WRITE");
        if (char.properties.writeWithoutResponse) props.push("WRITE NO RESP");
        if (char.properties.notify) props.push("NOTIFY");

        const div = document.createElement('div');
        div.className = 'char-block';
        div.innerHTML = `
            <span class="char-uuid">${getServiceName(char.uuid)}</span>
            <div class="char-props">[${props.join(', ')}]</div>
            <div class="actions">
                ${char.properties.read ? `<button class="btn-read">READ</button>` : ''}
                ${char.properties.notify ? `<button class="btn-notify">SUBSCRIBE</button>` : ''}
                ${(char.properties.write || char.properties.writeWithoutResponse) ? `<button class="btn-write">WRITE</button>` : ''}
            </div>
            <div class="value-display">--</div>
        `;

        // Event Listeners
        if (char.properties.read) {
            div.querySelector('.btn-read').onclick = async () => {
                try {
                    log(`Lese ${char.uuid}...`, "info");
                    const value = await char.readValue();
                    const hex = dataToHex(value);
                    div.querySelector('.value-display').style.display = 'block';
                    div.querySelector('.value-display').innerText = hex;
                    log(`READ OK: ${hex}`, "data");
                } catch (e) { log(`Read Fehler: ${e}`, "error"); }
            };
        }

        if (char.properties.notify) {
            div.querySelector('.btn-notify').onclick = async (e) => {
                try {
                    if (!char._isNotifying) {
                        await char.startNotifications();
                        char.addEventListener('characteristicvaluechanged', handleNotification);
                        char._isNotifying = true;
                        e.target.innerText = "STOP SUBS";
                        e.target.style.background = "#cf6679";
                        log(`Notify gestartet für ${char.uuid}`, "success");
                    } else {
                        await char.stopNotifications();
                        char.removeEventListener('characteristicvaluechanged', handleNotification);
                        char._isNotifying = false;
                        e.target.innerText = "SUBSCRIBE";
                        e.target.style.background = "#333";
                        log(`Notify gestoppt für ${char.uuid}`, "info");
                    }
                } catch (e) { log(`Notify Fehler: ${e}`, "error"); }
            };
        }

        if (char.properties.write || char.properties.writeWithoutResponse) {
            div.querySelector('.btn-write').onclick = () => {
                const val = prompt("Hex Wert eingeben (z.B. 01 FF 0A):");
                if (val) sendHex(char, val);
            };
        }

        container.appendChild(div);
    }

    function handleNotification(event) {
        const value = event.target.value;
        const hex = dataToHex(value);
        log(`NOTIFY [${getServiceName(event.target.uuid)}]: ${hex}`, "data");
        // Update UI if visible
        // Hier könnte man das UI Element suchen und updaten
    }

    async function sendHex(char, hexStr) {
        try {
            // Säubere den String
            const cleanStr = hexStr.replace(/\s+/g, '').replace(/0x/g, '');
            if (cleanStr.length % 2 !== 0) throw new Error("Ungültige Hex Länge");
            
            const byteArray = new Uint8Array(cleanStr.length / 2);
            for (let i = 0; i < cleanStr.length; i += 2) {
                byteArray[i / 2] = parseInt(cleanStr.substring(i, i + 2), 16);
            }

            log(`Sende: ${dataToHex(new DataView(byteArray.buffer))} an ${char.uuid}`, "info");
            await char.writeValue(byteArray);
            log("Write erfolgreich!", "success");
        } catch (e) {
            log(`Write Fehler: ${e.message}`, "error");
        }
    }

    function onDisconnected() {
        log("Gerät getrennt!", "warn");
        ui.btnScan.disabled = false;
        ui.btnDisconnect.disabled = true;
        ui.deviceInfo.innerText = "Kein Gerät verbunden.";
        ui.servicesContainer.innerHTML = '';
        currentDevice = null;
        currentServer = null;
    }

    // Utility: UUID Shortener / Namer
    function getServiceName(uuid) {
        if (uuid.startsWith("0000180f")) return "Battery Service";
        if (uuid.startsWith("0000180a")) return "Device Info";
        if (uuid.startsWith("0000")) return "0x" + uuid.substring(4, 8).toUpperCase(); 
        return uuid;
    }

    ui.btnScan.addEventListener('click', startScan);
    ui.btnDisconnect.addEventListener('click', () => {
        if (currentDevice && currentDevice.gatt.connected) {
            currentDevice.gatt.disconnect();
        }
    });

</script>
</body>
</html>
