<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLE PenTest V3</title>
    <style>
        :root { --bg: #050505; --surf: #141414; --prim: #00ff9d; --sec: #00ccff; --tert: #ff00ff; --err: #ff3333; --txt: #d0d0d0; }
        * { box-sizing: border-box; outline: none; }
        body { font-family: 'Consolas', 'Monaco', monospace; background: var(--bg); color: var(--txt); margin: 0; padding-bottom: 400px; font-size: 13px; }
        
        /* UI Components */
        button { background: #222; color: var(--prim); border: 1px solid #333; padding: 6px 10px; font-family: inherit; font-weight: bold; cursor: pointer; }
        button:active { background: var(--prim); color: #000; }
        button:disabled { color: #555; border-color: #222; }
        button.danger { color: var(--err); border-color: var(--err); }
        input, textarea { background: #111; color: #fff; border: 1px solid #333; font-family: monospace; padding: 5px; width: 100%; }
        
        header { background: var(--surf); padding: 8px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
        
        .panel { background: var(--surf); border: 1px solid #333; margin: 10px; padding: 10px; position: relative; }
        .panel-head { color: var(--prim); border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px; font-weight: bold; display: flex; justify-content: space-between; }
        
        /* Graph */
        canvas { width: 100%; height: 120px; background: #000; border: 1px solid #333; display: block; }
        
        /* Injector */
        .injector-grid { display: grid; grid-template-columns: 1fr auto; gap: 5px; }
        
        /* Device Tree */
        .svc { margin-top: 8px; font-weight: bold; color: #fff; }
        .chr { border-left: 2px solid #333; margin-left: 8px; padding-left: 8px; margin-top: 4px; padding-bottom: 4px; }
        .chr-head { font-size: 0.75rem; color: #888; display: flex; justify-content: space-between; }
        .chr-val { color: var(--sec); font-weight: bold; margin: 2px 0; word-break: break-all; }
        .controls { display: flex; gap: 4px; margin-top: 4px; }
        .btn-xs { font-size: 0.7rem; padding: 2px 6px; }

        /* Terminal */
        #term {
            position: fixed; bottom: 0; left: 0; right: 0; height: 25vh;
            background: rgba(0,0,0,0.92); border-top: 1px solid var(--prim);
            overflow-y: auto; padding: 5px; font-size: 0.7rem; z-index: 100;
        }
        .log { border-bottom: 1px solid #222; display: flex; }
        .ts { min-width: 55px; color: #555; margin-right: 5px; }
        .l-tx { color: var(--tert); } .l-rx { color: var(--prim); } .l-sys { color: #888; } .l-err { color: var(--err); }
        
        /* Tabs */
        .tabs { display: flex; margin: 10px 10px 0 10px; border-bottom: 1px solid #333; }
        .tab { padding: 8px 15px; cursor: pointer; background: #111; border: 1px solid #333; border-bottom: none; margin-right: 5px; opacity: 0.6; }
        .tab.active { background: var(--surf); opacity: 1; color: var(--prim); border-top: 2px solid var(--prim); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<header>
    <button id="btnCon">CONNECT</button>
    <button id="btnExp" style="font-size: 0.7rem;">EXPORT LOG</button>
</header>

<div class="tabs">
    <div class="tab active" onclick="swTab('live')">LIVE & I/O</div>
    <div class="tab" onclick="swTab('code')">SCRIPTING</div>
</div>

<div id="live" class="tab-content active">
    <div class="panel">
        <div class="panel-head">SCOPE (Multi-Ch) <button class="btn-xs" onclick="clearPlot()">CLR</button></div>
        <canvas id="scope"></canvas>
        <div style="font-size:0.7rem; color:#666; margin-top:2px;">Legende: CH1(Grün), CH2(Blau), CH3(Pink)</div>
    </div>
    
    <div class="panel">
        <div class="panel-head">DEVICE TREE</div>
        <div id="tree">Not connected.</div>
    </div>
</div>

<div id="code" class="tab-content">
    <div class="panel">
        <div class="panel-head">RX PARSER (JS)</div>
        <textarea id="codeParse" style="height:80px;">
// Return number or array [x,y,z]
if(data.byteLength >= 1) return data.getUint8(0);
return 0;
        </textarea>
    </div>

    <div class="panel">
        <div class="panel-head">TX INJECTOR (Async JS)</div>
        <textarea id="codeInject" style="height:100px;">
// Globals: 'char' (selected), 'wait(ms)', 'send([bytes])'
// Bsp: Fuzzer 0x00-0x0F
for(let i=0; i<16; i++) {
  log('Fuzzing: ' + i);
  await send([i]); 
  await wait(200); 
}
        </textarea>
        <div class="injector-grid" style="margin-top:5px;">
            <div style="font-size:0.7rem; color:#888; align-self:center;">Target: <span id="injTarget" style="color:var(--tert)">NONE</span></div>
            <div>
                <button id="btnRun" class="danger">RUN</button>
                <button id="btnStop">STOP</button>
            </div>
        </div>
    </div>
</div>

<div id="term"></div>

<script>
    // --- CORE GLOBALS ---
    let device, server;
    let sessionLog = [];
    let plotBuffers = [[], [], []]; // Max 3 Channels
    const MAX_POINTS = 200;
    let selectedCharForInjection = null;
    let injectionRunning = false;

    // --- LOGGING ---
    const term = document.getElementById('term');
    function log(msg, type='sys') {
        const ts = new Date().toISOString().substring(11,23);
        const line = `<div class="log"><span class="ts">${ts}</span><span class="l-${type}">${msg}</span></div>`;
        term.insertAdjacentHTML('beforeend', line);
        term.scrollTop = term.scrollHeight;
        sessionLog.push({ts, type, msg});
    }

    // --- EXPORT ---
    document.getElementById('btnExp').onclick = () => {
        const blob = new Blob([JSON.stringify(sessionLog, null, 2)], {type : 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ble_session_${Date.now()}.json`;
        a.click();
    };

    // --- PLOTTER ---
    const cvs = document.getElementById('scope');
    const ctx = cvs.getContext('2d');
    const colors = ['#00ff9d', '#00ccff', '#ff00ff'];
    
    function resize() { cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight; }
    window.onresize = resize; resize();

    function draw() {
        const w = cvs.width, h = cvs.height;
        ctx.clearRect(0,0,w,h);
        
        plotBuffers.forEach((buf, chIdx) => {
            if(buf.length < 2) return;
            ctx.beginPath();
            ctx.strokeStyle = colors[chIdx % colors.length];
            ctx.lineWidth = 2;
            
            // Auto-Scale
            let min = Math.min(...buf), max = Math.max(...buf);
            if(min===max) { min-=1; max+=1; }
            
            const xStep = w / (MAX_POINTS-1);
            for(let i=0; i<buf.length; i++) {
                const norm = (buf[i] - min) / (max - min);
                const y = h - (norm * (h-10)) - 5;
                if(i===0) ctx.moveTo(0, y); else ctx.lineTo(i*xStep, y);
            }
            ctx.stroke();
        });
        requestAnimationFrame(draw);
    }
    draw();
    window.clearPlot = () => { plotBuffers = [[],[],[]]; };

    // --- PARSER RUNNER ---
    function parse(charUUID, data) {
        // 1. Log Hex
        const hex = [...new Uint8Array(data.buffer)].map(b=>b.toString(16).padStart(2,'0').toUpperCase()).join(' ');
        log(`RX [${shortID(charUUID)}]: ${hex}`, 'rx');
        
        // 2. Exec User Script
        try {
            const fn = new Function('data', document.getElementById('codeParse').value);
            const res = fn(data);
            
            // 3. Handle Result (Single or Array)
            const vals = Array.isArray(res) ? res : [res];
            vals.forEach((v, i) => {
                if(i < 3 && typeof v === 'number') {
                    plotBuffers[i].push(v);
                    if(plotBuffers[i].length > MAX_POINTS) plotBuffers[i].shift();
                }
            });
            return `${hex} => ${JSON.stringify(res)}`;
        } catch(e) { return `${hex} (Parse Err)`; }
    }

    // --- INJECTOR RUNNER ---
    document.getElementById('btnRun').onclick = async () => {
        if(!selectedCharForInjection) return alert("Select a WRITE char first (click 'SEL' in tree).");
        injectionRunning = true;
        log("Injector STARTED", 'sys');
        
        const code = document.getElementById('codeInject').value;
        const char = selectedCharForInjection;
        
        // Sandbox Helper
        const wait = (ms) => new Promise(r => setTimeout(r, ms));
        const send = async (arr) => {
            if(!injectionRunning) throw "Stopped";
            const buf = new Uint8Array(arr);
            await char.writeValue(buf);
            log(`TX [${shortID(char.uuid)}]: ${[...buf].map(b=>b.toString(16).padStart(2,'0')).join(' ')}`, 'tx');
        };

        try {
            // Async Function Constructor for await support
            const AsyncFunction = Object.getPrototypeOf(async function(){}).constructor;
            const fn = new AsyncFunction('char', 'send', 'wait', 'log', code);
            await fn(char, send, wait, (m)=>log(m,'sys'));
            log("Injector FINISHED", 'sys');
        } catch(e) {
            if(e !== "Stopped") log(`Injector ERR: ${e}`, 'err');
        }
        injectionRunning = false;
    };
    document.getElementById('btnStop').onclick = () => { injectionRunning = false; log("Injector STOPPING...", 'sys'); };

    // --- BLE CONNECT ---
    document.getElementById('btnCon').onclick = async () => {
        try {
            device = await navigator.bluetooth.requestDevice({
                acceptAllDevices:true, 
                optionalServices: ["battery_service", "device_information", "health_thermometer"] // Add more if needed
            });
            device.addEventListener('gattserverdisconnected', () => {
                document.getElementById('tree').innerHTML = "Disconnected";
                log("Disconnected", 'err');
            });
            server = await device.gatt.connect();
            log(`Connected: ${device.name}`, 'sys');
            renderTree();
        } catch(e) { log(e, 'err'); }
    };

    async function renderTree() {
        const root = document.getElementById('tree');
        root.innerHTML = 'Scanning...';
        const services = await server.getPrimaryServices();
        root.innerHTML = '';
        
        for(const s of services) {
            const sDiv = document.createElement('div');
            sDiv.className = 'svc';
            sDiv.innerText = 'SVC: ' + shortID(s.uuid);
            root.appendChild(sDiv);
            
            try {
                const chars = await s.getCharacteristics();
                for(const c of chars) {
                    const cDiv = document.createElement('div');
                    cDiv.className = 'chr';
                    const valID = `v-${c.uuid.split('-')[0]}`;
                    
                    // Build Buttons
                    let btns = '';
                    if(c.properties.read) btns += `<button class="btn-xs" onclick="readCh('${c.uuid}')">RD</button>`;
                    if(c.properties.notify) btns += `<button class="btn-xs" onclick="subCh('${c.uuid}')">SUB</button>`;
                    if(c.properties.write || c.properties.writeWithoutResponse) btns += `<button class="btn-xs" style="border-color:var(--tert); color:var(--tert)" onclick="selCh('${c.uuid}')">SEL (Inj)</button>`;
                    
                    cDiv.innerHTML = `
                        <div class="chr-head"><span>${shortID(c.uuid)}</span><span>${getProps(c)}</span></div>
                        <div class="chr-val" id="${valID}">-</div>
                        <div class="controls">${btns}</div>
                    `;
                    sDiv.appendChild(cDiv);
                    
                    // Store Ref for access
                    c._elementVal = cDiv.querySelector('.chr-val');
                    c._ref = c; // hacky self ref
                }
            } catch(e) { log(`Err svc ${shortID(s.uuid)}`, 'err'); }
        }
    }

    // --- BLE ACTIONS ---
    // Global maps to find objects back from UUID strings (simplified)
    // In a real robust app we would map properly, here we iterate for simplicity in one file
    async function findChar(uuid) {
        const services = await server.getPrimaryServices();
        for(const s of services) {
            try { 
                const chars = await s.getCharacteristics();
                const match = chars.find(c => c.uuid === uuid);
                if(match) return match;
            } catch(e){}
        }
        return null;
    }

    window.readCh = async (uuid) => {
        const c = await findChar(uuid);
        if(c) {
            const v = await c.readValue();
            c._elementVal.innerText = parse(uuid, v);
        }
    };

    window.subCh = async (uuid) => {
        const c = await findChar(uuid);
        if(c) {
            if(c._subbed) {
                await c.stopNotifications();
                c._subbed = false;
                log(`Unsub ${shortID(uuid)}`, 'sys');
            } else {
                await c.startNotifications();
                c.addEventListener('characteristicvaluechanged', (e) => {
                    c._elementVal.innerText = parse(uuid, e.target.value);
                });
                c._subbed = true;
                log(`Subscribed ${shortID(uuid)}`, 'sys');
            }
        }
    };

    window.selCh = async (uuid) => {
        const c = await findChar(uuid);
        if(c) {
            selectedCharForInjection = c;
            document.getElementById('injTarget').innerText = shortID(uuid);
            swTab('code'); // Switch to code tab
        }
    };

    // --- UTILS ---
    function shortID(u) { return u.startsWith('0000') ? u.substring(4,8).toUpperCase() : u.substring(0,8)+'...'; }
    function getProps(c) { 
        let p=[]; 
        if(c.properties.read) p.push('R'); 
        if(c.properties.write||c.properties.writeWithoutResponse) p.push('W'); 
        if(c.properties.notify) p.push('N'); 
        return p.join(''); 
    }
    window.swTab = (id) => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(id).classList.add('active');
        resize(); // fix canvas
    };
</script>
</body>
</html>
